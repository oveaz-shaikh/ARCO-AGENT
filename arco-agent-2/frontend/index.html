

<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARCO Agent 2.0 | Retail Intelligence</title>



  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>



  <style>

    :root {

      --bg: #f4f6fb;

      --panel: #fff;

      --ink: #17243b;

      --muted: #748198;

      --line: #e6ebf2;

      --nav: #111c31;

      --accent: #4c68f5;

      --green: #16815d;

      --red: #bd4242;

    }



    * { box-sizing: border-box; }



    body {

      margin: 0;

      background: var(--bg);

      color: var(--ink);

      font-family: Arial, sans-serif;

    }



    button, input, select { font: inherit; }

    button { cursor: pointer; }



    .shell {

      min-height: 100vh;

      display: grid;

      grid-template-columns: 225px minmax(0, 1fr);

    }



    aside {

      background: var(--nav);

      color: #d9e2f2;

      padding: 25px 16px;

    }



    .brand {

      display: flex;

      align-items: center;

      gap: 11px;

      padding: 0 8px 30px;

      color: #fff;

    }



    .logo {

      width: 40px;

      height: 40px;

      border-radius: 12px;

      background: #5876ff;

      display: grid;

      place-items: center;

      font-size: 22px;

      font-weight: bold;

    }



    .brand strong { display: block; font-size: 16px; }

    .brand small { color: #8e9cb4; font-size: 10px; }



    .nav-label {

      padding: 15px 12px 8px;

      color: #8090aa;

      text-transform: uppercase;

      font-size: 10px;

      letter-spacing: 1.3px;

    }



    .nav-item {

      padding: 12px;

      border-radius: 9px;

      margin: 3px 0;

      font-size: 13px;

      color: #bdc8da;

    }



    .nav-item.active { background: #26385c; color: white; }
    .nav-link { display: block; text-decoration: none; }
    .nav-link:hover { background: #1c2c49; color: white; }

    .nav-item span { display: inline-block; width: 25px; }



    .side-note {

      margin: 32px 5px 0;

      padding: 13px;

      border: 1px solid #34435e;

      border-radius: 12px;

      color: #aebbd0;

      font-size: 11px;

      line-height: 1.6;

    }



    main { padding: 28px 30px 40px; min-width: 0; }



    .topbar {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      margin-bottom: 24px;

    }



    h1 { font-size: 25px; margin: 0 0 7px; }

    h2 { font-size: 15px; margin: 0; }

    h3 { font-size: 12px; margin: 15px 0 7px; }

    p { line-height: 1.6; }



    .subtitle { color: var(--muted); font-size: 13px; }



    .top-actions {

      display: flex;

      align-items: center;

      gap: 9px;

      flex-wrap: wrap;

    }



    .pill {

      border: 1px solid var(--line);

      background: white;

      border-radius: 25px;

      padding: 9px 12px;

      font-size: 11px;

      color: #56647a;

    }



    .dot {

      display: inline-block;

      width: 7px;

      height: 7px;

      border-radius: 50%;

      background: #25b981;

      margin-right: 7px;

    }



    .grid { display: grid; gap: 16px; }



    .kpis {

      grid-template-columns: repeat(4, minmax(0, 1fr));

      margin-bottom: 18px;

    }



    .card {

      background: var(--panel);

      border: 1px solid var(--line);

      border-radius: 15px;

      padding: 19px;

      min-width: 0;

      box-shadow: 0 3px 12px rgba(28, 45, 78, .025);

      margin-bottom: 17px;

    }



    .kpi-label { color: var(--muted); font-size: 12px; margin-bottom: 13px; }

    .kpi-value { font-size: 24px; font-weight: bold; margin-bottom: 7px; overflow-wrap: anywhere; }

    .kpi-foot { color: #8995a8; font-size: 11px; }



    .content-grid {

      grid-template-columns: minmax(0, 1.15fr) minmax(320px, 1fr);

    }



    .section-head {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      margin-bottom: 15px;

    }



    .small { font-size: 11px; color: var(--muted); line-height: 1.6; }



    .form-grid {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 13px;

      margin: 16px 0;

    }



    label {

      display: block;

      font-size: 11px;

      color: var(--muted);

      margin-bottom: 6px;

    }



    input, select {

      width: 100%;

      border: 1px solid var(--line);

      background: white;

      border-radius: 8px;

      padding: 11px;

      color: var(--ink);

      outline: none;

    }



    input:focus, select:focus { border-color: #879aff; }



    .primary {

      background: var(--accent);

      color: white;

      border: 0;

      border-radius: 9px;

      padding: 12px 16px;

      font-size: 12px;

      font-weight: bold;

    }



    .primary:disabled { opacity: .55; cursor: wait; }



    .secondary {

      background: white;

      border: 1px solid var(--line);

      color: var(--ink);

      border-radius: 8px;

      padding: 9px 12px;

      font-size: 12px;

    }



    .insight {

      background: #f2f5ff;

      border: 1px solid #e0e7ff;

      padding: 14px;

      border-radius: 11px;

      margin-top: 15px;

    }



    .insight strong { font-size: 13px; display: block; margin-bottom: 7px; }

    .insight p { font-size: 12px; color: #5d6b84; margin: 0; }



    .metric-row {

      display: grid;

      grid-template-columns: repeat(3, minmax(0, 1fr));

      gap: 10px;

      margin-top: 14px;

    }



    .metric {

      padding: 12px;

      background: #f8f9fc;

      border: 1px solid var(--line);

      border-radius: 10px;

      min-width: 0;

    }



    .metric-label { font-size: 10px; color: var(--muted); margin-bottom: 8px; }

    .metric-value { font-size: 17px; font-weight: bold; overflow-wrap: anywhere; }



    .chart {

      height: 220px;

      display: flex;

      gap: 10px;

      padding: 15px 4px 0;

      border-bottom: 1px solid var(--line);

    }



    .bar-col {

      flex: 1;

      min-width: 0;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: flex-end;

      gap: 8px;

      font-size: 10px;

      color: var(--muted);

    }



    .bar-space {

      width: 100%;

      height: 175px;

      display: flex;

      align-items: flex-end;

      justify-content: center;

    }



    .bar {

      width: min(34px, 75%);

      background: linear-gradient(180deg, #7790ff, #4768f5);

      border-radius: 6px 6px 0 0;

      min-height: 2px;

    }



    .bar.best { background: linear-gradient(180deg, #4bd3a0, #159b70); }

    .bar.rejected { background: #d9deea; }



    .table-wrap { overflow: auto; }



    table {

      border-collapse: collapse;

      width: 100%;

      font-size: 12px;

      white-space: nowrap;

    }



    th {

      text-align: left;

      color: #8a96a8;

      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: .4px;

      padding: 12px 10px;

      border-bottom: 1px solid var(--line);

    }



    td { padding: 13px 10px; border-bottom: 1px solid #f0f2f6; }

    tr.recommended { background: #f0fbf6; }



    .tag {

      display: inline-block;

      background: #e8f8f0;

      color: #16815d;

      border-radius: 6px;

      padding: 5px 7px;

      font-size: 10px;

    }



    .tag.bad { background: #fff0ee; color: #bd4242; }



    .loading, .error, .notice {

      padding: 14px;

      font-size: 12px;

      line-height: 1.6;

      border-radius: 9px;

      margin: 10px 0;

    }



    .loading { color: var(--muted); }

    .error { color: #b42318; background: #fff5f4; }

    .notice { color: #52617b; background: #f7f8fc; border: 1px solid var(--line); }



    .strategy-grid {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 18px;

      margin-top: 12px;

    }



    .strategy-list {

      padding-left: 18px;

      margin: 8px 0 0;

      color: #52617b;

      font-size: 12px;

      line-height: 1.8;

    }



    .strategy-section { margin-top: 14px; }

    .strategy-section h3 { margin: 0 0 7px; font-size: 12px; }



    .strategy-pill {

      display: inline-block;

      padding: 5px 8px;

      border-radius: 20px;

      background: #eef2ff;

      color: #4358c8;

      font-size: 10px;

      margin: 0 6px 6px 0;

    }



    .strategy-warning {

      border-left: 3px solid #e3a008;

      padding: 10px 12px;

      background: #fff9e8;

      color: #725b1e;

      border-radius: 6px;

      font-size: 12px;

      line-height: 1.6;

      margin-top: 12px;

    }



    .footer { text-align: center; color: #9aa4b4; font-size: 10px; margin-top: 24px; }



    @media (max-width: 1100px) {

      .shell { grid-template-columns: 190px minmax(0, 1fr); }

      main { padding: 22px; }

      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }

      .content-grid { grid-template-columns: 1fr; }

    }



    @media (max-width: 700px) {

      .shell { grid-template-columns: 1fr; }

      aside { display: none; }

      main { padding: 16px; }

      .topbar { align-items: flex-start; flex-direction: column; }

      .form-grid, .strategy-grid { grid-template-columns: 1fr; }

      .metric-row { grid-template-columns: 1fr; }

      .kpi-value { font-size: 20px; }

    }

  </style>

</head>



<body>

<div id="root"></div>



<script type="text/babel">

const { useEffect, useState } = React;

const API = "http://127.0.0.1:8000";



const money = value => {

  if (value === null || value === undefined || !Number.isFinite(Number(value))) return "—";

  return new Intl.NumberFormat("en-IN", {

    style: "currency",

    currency: "INR",

    maximumFractionDigits: 2

  }).format(Number(value));

};



const number = value => {

  if (value === null || value === undefined || !Number.isFinite(Number(value))) return "—";

  return new Intl.NumberFormat("en-IN", { maximumFractionDigits: 2 }).format(Number(value));

};



function ListSection({ title, items }) {

  if (!items || !items.length) return null;



  return (

    <div className="strategy-section">

      <h3>{title}</h3>

      <ul className="strategy-list">

        {items.map((item, i) => <li key={title + i}>{String(item)}</li>)}

      </ul>

    </div>

  );

}



function App() {

  const [health, setHealth] = useState(null);

  const [summary, setSummary] = useState(null);

  const [result, setResult] = useState(null);

  const [strategy, setStrategy] = useState(null);

  const [error, setError] = useState("");

  const [strategyError, setStrategyError] = useState("");

  const [loading, setLoading] = useState(false);

  const [strategyLoading, setStrategyLoading] = useState(false);



  const [productId, setProductId] = useState("P0001");

  const [stock, setStock] = useState("100");

  const [campaignCost, setCampaignCost] = useState("500");

  const [budget, setBudget] = useState("5000");

  const [maxDiscount, setMaxDiscount] = useState("30");

  const [minMargin, setMinMargin] = useState("20");

  const [campaignDays, setCampaignDays] = useState("7");

  const [objective, setObjective] = useState("balanced");



  async function getJSON(url, options = {}) {

    let response;



    try {

      response = await fetch(url, options);

    } catch (error) {

      throw new Error(

        "Cannot connect to the API. Start the FastAPI backend at http://127.0.0.1:8000."

      );

    }



    const data = await response.json().catch(() => ({}));



    if (!response.ok) {

      const detail = data.detail;

      let message = "Request failed: HTTP " + response.status;



      if (typeof detail === "string") {

        message = detail;

      } else if (Array.isArray(detail)) {

        message = detail.map(item => item.msg || JSON.stringify(item)).join("; ");

      } else if (detail && typeof detail === "object") {

        message = detail.message || JSON.stringify(detail);

      }



      throw new Error(message);

    }



    return data;

  }



  async function loadDashboard() {

    try {

      const [h, s] = await Promise.all([

        getJSON(API + "/api/health"),

        getJSON(API + "/api/summary")

      ]);



      setHealth(h);

      setSummary(s);

      setError("");

    } catch (e) {

      setHealth(null);

      setError(e.message + " Check that FastAPI is running and synthetic data exists.");

    }

  }



  function buildPayload() {

    const payload = {

      product_id: productId.trim(),

      stock: Number(stock),

      campaign_cost: Number(campaignCost),

      budget_limit: Number(budget),

      max_discount_pct: Number(maxDiscount),

      min_margin_pct: Number(minMargin),

      campaign_days: Number(campaignDays),

      base_demand: 30

    };



    if (!payload.product_id) throw new Error("Enter a product ID.");



    if (!Number.isInteger(payload.stock) || payload.stock < 0) {

      throw new Error("Stock must be a whole number greater than or equal to zero.");

    }



    if (!Number.isInteger(payload.campaign_days) ||

        payload.campaign_days < 1 ||

        payload.campaign_days > 90) {

      throw new Error("Campaign duration must be between 1 and 90 days.");

    }



    for (const key of ["campaign_cost", "budget_limit", "max_discount_pct", "min_margin_pct"]) {

      if (!Number.isFinite(payload[key]) || payload[key] < 0) {

        throw new Error("Enter valid non-negative campaign settings.");

      }

    }



    if (payload.max_discount_pct > 100 || payload.min_margin_pct > 100) {

      throw new Error("Discount and margin limits cannot exceed 100%.");

    }



    return payload;

  }



  async function optimize(e) {

    if (e) e.preventDefault();



    setLoading(true);

    setError("");

    setResult(null);



    try {

      const payload = buildPayload();

      const data = await getJSON(API + "/api/optimize", {

        method: "POST",

        headers: { "Content-Type": "application/json" },

        body: JSON.stringify(payload)

      });



      setResult(data);

    } catch (e) {

      setError(e.message);

    } finally {

      setLoading(false);

    }

  }



  async function generateMarketingStrategy() {

    setStrategyLoading(true);

    setStrategyError("");

    setStrategy(null);



    try {

      const payload = {

        ...buildPayload(),

        objective: objective

      };



      const data = await getJSON(API + "/api/campaigns/generate", {

        method: "POST",

        headers: { "Content-Type": "application/json" },

        body: JSON.stringify(payload)

      });



      setStrategy(data);

    } catch (e) {

      setStrategyError(e.message);

    } finally {

      setStrategyLoading(false);

    }

  }



  useEffect(() => {

    loadDashboard();

  }, []);



  const candidates = result?.candidates || [];

  const best = result?.best_strategy || null;

  const baseline = result?.baseline || null;

  const feasible = candidates.filter(c => c.feasible);

  const maxProfit = Math.max(1, ...feasible.map(c => Number(c.net_profit) || 0));



  return (

    <div className="shell">

      <aside>

        <div className="brand">

          <div className="logo">A</div>

          <div>

            <strong>ARCO Agent</strong>

            <small>RETAIL INTELLIGENCE</small>

          </div>

        </div>



        <div className="nav-label">Workspace</div>

        <div className="nav-item active"><span>▦</span>Overview</div>

        <div className="nav-item"><span>◉</span>Customer Segments</div>

        <div className="nav-item"><span>↗</span>Sales Forecast</div>

        <div className="nav-item"><span>✳</span>Campaign Studio</div>

        <div className="nav-item"><span>⌘</span>Optimization</div>
        <a className="nav-item nav-link" href="history.html"><span>▤</span>Campaign History</a>



        <div className="nav-label">System</div>

        <div className="nav-item"><span>⚙</span>Settings</div>



        <div className="side-note">

          <strong style={{ color: "#fff" }}>Prototype mode</strong><br />

          All data and business rules are synthetic. No live retail systems are connected.

        </div>

      </aside>



      <main>

        <div className="topbar">

          <div>

            <h1>Retail intelligence overview</h1>

            <div className="subtitle">Marketing strategy and sales optimization workspace</div>

          </div>



          <div className="top-actions">

            <div className="pill">

              <span className="dot" style={{ background: health ? "#25b981" : "#e3a008" }}></span>

              {health ? "API connected" : "API disconnected"}

            </div>

            <div className="pill">SYNTHETIC DEMO DATA</div>

            <button className="secondary" onClick={loadDashboard}>Refresh</button>

          </div>

        </div>



        {error && <div className="error">{error}</div>}



        <div className="grid kpis">

          <div className="card">

            <div className="kpi-label">Products in catalog</div>

            <div className="kpi-value">{summary ? number(summary.products) : "—"}</div>

            <div className="kpi-foot">Synthetic product catalog</div>

          </div>



          <div className="card">

            <div className="kpi-label">Customers simulated</div>

            <div className="kpi-value">{summary ? number(summary.customers) : "—"}</div>

            <div className="kpi-foot">Fictional customer records</div>

          </div>



          <div className="card">

            <div className="kpi-label">Historical revenue</div>

            <div className="kpi-value">{summary ? money(summary.historical_revenue) : "—"}</div>

            <div className="kpi-foot">Generated transaction history</div>

          </div>



          <div className="card">

            <div className="kpi-label">Inventory units</div>

            <div className="kpi-value">{summary ? number(summary.inventory_units) : "—"}</div>

            <div className="kpi-foot">Synthetic inventory snapshot</div>

          </div>

        </div>



        <div className="grid content-grid">

          <section className="card">

            <div className="section-head">

              <h2>Offer performance comparison</h2>

              <span className="small">Trained-model API</span>

            </div>



            {!result ? (

              <div className="loading">

                Configure a campaign and select “Evaluate campaign” to compare candidate discounts.

              </div>

            ) : (

              <>

                <div className="chart">

                  {candidates.map(c => {

                    const height = c.feasible

                      ? Math.max(2, Math.max(0, Number(c.net_profit)) / maxProfit * 170)

                      : 2;



                    return (

                      <div className="bar-col" key={c.discount_pct}>

                        <div className="bar-space">

                          <div

                            className={

                              "bar " +

                              (!c.feasible ? "rejected " : "") +

                              (best && c.discount_pct === best.discount_pct ? "best" : "")

                            }

                            title={c.feasible

                              ? "Net profit: " + money(c.net_profit)

                              : c.reason}

                            style={{ height: height + "px" }}

                          />

                        </div>

                        <span>{c.discount_pct}%</span>

                      </div>

                    );

                  })}

                </div>



                <div className="small" style={{ marginTop: 12 }}>

                  Estimated campaign net profit by discount. Green marks the highest-net-profit

                  feasible offer from the optimizer. The strategy objective may select a

                  different offer to prioritize sales or inventory movement.

                </div>



                <div className="metric-row">

                  <div className="metric">

                    <div className="metric-label">Campaign duration</div>

                    <div className="metric-value">{result.campaign_days} days</div>

                  </div>

                  <div className="metric">

                    <div className="metric-label">Baseline profit</div>

                    <div className="metric-value">{baseline ? money(baseline.net_profit) : "—"}</div>

                  </div>

                  <div className="metric">

                    <div className="metric-label">Best discount</div>

                    <div className="metric-value">{best ? best.discount_pct + "%" : "None"}</div>

                  </div>

                </div>

              </>

            )}

          </section>



          <section className="card">

            <div className="section-head">

              <h2>Campaign optimizer</h2>

              <span className="small">Demand model</span>

            </div>



            <form onSubmit={optimize}>

              <div className="form-grid">

                <div>

                  <label>Product ID</label>

                  <input value={productId} onChange={e => setProductId(e.target.value)}

                    required placeholder="P0001" />

                </div>



                <div>

                  <label>Available stock (units)</label>

                  <input type="number" min="0" step="1" value={stock}

                    onChange={e => setStock(e.target.value)} required />

                </div>



                <div>

                  <label>Campaign duration (days)</label>

                  <input type="number" min="1" max="90" step="1" value={campaignDays}

                    onChange={e => setCampaignDays(e.target.value)} required />

                </div>



                <div>

                  <label>Campaign cost (₹)</label>

                  <input type="number" min="0" step="50" value={campaignCost}

                    onChange={e => setCampaignCost(e.target.value)} required />

                </div>



                <div>

                  <label>Campaign budget limit (₹)</label>

                  <input type="number" min="0" step="100" value={budget}

                    onChange={e => setBudget(e.target.value)} required />

                </div>



                <div>

                  <label>Maximum discount (%)</label>

                  <input type="number" min="0" max="100" step="5" value={maxDiscount}

                    onChange={e => setMaxDiscount(e.target.value)} required />

                </div>



                <div>

                  <label>Minimum gross margin (%)</label>

                  <input type="number" min="0" max="100" step="1" value={minMargin}

                    onChange={e => setMinMargin(e.target.value)} required />

                </div>

              </div>



              <button className="primary" disabled={loading}>

                {loading ? "Evaluating campaign…" : "Evaluate campaign →"}

              </button>

            </form>



            {best && (

              <div className="insight">

                <strong>Optimizer's best offer: {best.discount_pct}% discount</strong>

                <p>

                  {number(best.predicted_units)} expected units over {result.campaign_days} days.

                  Estimated net profit: {money(best.net_profit)}.

                  Gross margin: {number(best.margin_pct)}%.

                </p>



                <div className="metric-row">

                  <div className="metric">

                    <div className="metric-label">Revenue</div>

                    <div className="metric-value">{money(best.revenue)}</div>

                  </div>

                  <div className="metric">

                    <div className="metric-label">Net profit</div>

                    <div className="metric-value">{money(best.net_profit)}</div>

                  </div>

                  <div className="metric">

                    <div className="metric-label">Incremental profit</div>

                    <div className="metric-value" style={{

                      color: Number(best.incremental_profit) < 0 ? "var(--red)" : "var(--green)"

                    }}>

                      {money(best.incremental_profit)}

                    </div>

                  </div>

                </div>

              </div>

            )}



            {result && !best && (

              <div className="error">

                No offer satisfies all constraints. Review stock, campaign cost, budget, or minimum margin.

              </div>

            )}

          </section>

        </div>



        <section className="card">

          <div className="section-head">

            <div>

              <h2>AI Marketing Strategy Generator</h2>

              <div className="small">

                Combines demand predictions, financial constraints, business rules and optional LLM content.

              </div>

            </div>

            <span className="small">Hybrid strategy engine</span>

          </div>



          <div className="form-grid">

            <div>

              <label>Strategy objective</label>

              <select value={objective} onChange={e => setObjective(e.target.value)}>

                <option value="balanced">Balance profit, sales and inventory</option>

                <option value="profit">Prioritize profit</option>

                <option value="sales">Prioritize sales growth</option>

                <option value="inventory">Move available inventory</option>

              </select>

            </div>



            <div style={{ display: "flex", alignItems: "end" }}>

              <button

                type="button"

                className="primary"

                style={{ width: "100%" }}

                disabled={strategyLoading}

                onClick={generateMarketingStrategy}

              >

                {strategyLoading ? "Generating strategy…" : "Generate AI Marketing Strategy →"}

              </button>

            </div>

          </div>



          {strategyError && <div className="error">{strategyError}</div>}



          {strategyLoading && (

            <div className="loading">Evaluating offers and preparing the marketing plan…</div>

          )}



          {!strategy && !strategyLoading && !strategyError && (

            <div className="notice">

              Set your campaign inputs, choose an objective, and generate a strategy.

            </div>

          )}



          {strategy && (

            <>

              <div className="insight">

                <strong>

                  {strategy.product || "Product"} — {

                    strategy.status === "success"

                      ? number(strategy.recommended_discount_pct) + "% recommended discount"

                      : "No feasible campaign"

                  }

                </strong>

                <p>{strategy.recommendation}</p>



                <div style={{ marginTop: 10 }}>

                  <span className="strategy-pill">Objective: {strategy.objective}</span>

                  <span className="strategy-pill">Source: {strategy.generation_method || "rules"}</span>
                   {strategy.saved && strategy.campaign_id && (
                     <span className="strategy-pill">Saved campaign #{strategy.campaign_id}</span>
                   )}

                  {strategy.campaign_days && (

                    <span className="strategy-pill">{strategy.campaign_days} days</span>

                  )}

                </div>

              </div>



              {strategy.status === "success" && (

                <>

                  <div className="metric-row">

                    <div className="metric">

                      <div className="metric-label">Expected units</div>

                      <div className="metric-value">{number(strategy.expected_units)}</div>

                    </div>

                    <div className="metric">

                      <div className="metric-label">Estimated net profit</div>

                      <div className="metric-value">{money(strategy.expected_net_profit)}</div>

                    </div>

                    <div className="metric">

                      <div className="metric-label">Incremental vs baseline</div>

                      <div className="metric-value" style={{

                        color: Number(strategy.incremental_profit) < 0 ? "var(--red)" : "var(--green)"

                      }}>

                        {money(strategy.incremental_profit)}

                      </div>

                    </div>

                  </div>



                  {strategy.incremental_profit != null &&

                    Number(strategy.incremental_profit) < 0 && (

                      <div className="strategy-warning">

                        This campaign is estimated to earn less than the no-discount baseline.

                        Review the trade-off before selecting it.

                      </div>

                    )}



                  <div className="strategy-grid">

                    <div>

                      <ListSection

                        title="Target audience"

                        items={strategy.llm_plan?.target_audience || strategy.target_audience}

                      />

                      <ListSection

                        title="Marketing channels"

                        items={strategy.llm_plan?.channel_plan || strategy.channels}

                      />

                      <ListSection

                        title="Campaign ideas"

                        items={strategy.llm_plan?.messaging || strategy.campaign_ideas}

                      />

                    </div>



                    <div>

                      {strategy.llm_plan && (

                        <div className="strategy-section">

                          <h3>LLM campaign brief</h3>

                          <p className="small">{strategy.llm_plan.executive_summary || ""}</p>



                          {strategy.llm_plan.campaign_name && (

                            <p><strong>{strategy.llm_plan.campaign_name}</strong></p>

                          )}



                          <ListSection

                            title="Success metrics"

                            items={strategy.llm_plan.success_metrics}

                          />

                          <ListSection

                            title="Experiment plan"

                            items={strategy.llm_plan.experiment_plan}

                          />

                        </div>

                      )}



                      <ListSection title="Risks and limitations" items={strategy.risks} />

                      <ListSection title="Next actions" items={strategy.next_actions} />

                    </div>

                  </div>

                </>

              )}



              {strategy.status !== "success" && (

                <div className="strategy-warning">

                  No feasible strategy was found. Review the constraints and campaign inputs, then try again.

                </div>

              )}



              {strategy.llm_status && <div className="notice">{strategy.llm_status}</div>}

            </>

          )}

        </section>



        <section className="card">

          <div className="section-head">

            <h2>Candidate strategy details</h2>

            <span className="small">

              {candidates.length ? candidates.length + " candidate offers" : "Awaiting evaluation"}

            </span>

          </div>



          {!candidates.length ? (

            <div className="loading">Run the campaign optimizer to display the results table.</div>

          ) : (

            <div className="table-wrap">

              <table>

                <thead>

                  <tr>

                    <th>Discount</th>

                    <th>Status</th>

                    <th>Expected units</th>

                    <th>Revenue</th>

                    <th>Gross profit</th>

                    <th>Margin</th>

                    <th>Campaign cost</th>

                    <th>Net profit</th>

                    <th>Incremental profit</th>

                  </tr>

                </thead>



                <tbody>

                  {candidates.map(c => (

                    <tr

                      key={c.discount_pct}

                      className={best && c.discount_pct === best.discount_pct ? "recommended" : ""}

                    >

                      <td>{c.discount_pct}%</td>

                      <td>

                        <span className={"tag " + (!c.feasible ? "bad" : "")}>

                          {c.feasible ? "Feasible" : c.reason || "Rejected"}

                        </span>

                      </td>

                      <td>{number(c.predicted_units)}</td>

                      <td>{money(c.revenue)}</td>

                      <td>{money(c.gross_profit)}</td>

                      <td>{c.margin_pct == null ? "—" : number(c.margin_pct) + "%"}</td>

                      <td>{money(c.campaign_cost)}</td>

                      <td>{money(c.net_profit)}</td>

                      <td>{money(c.incremental_profit)}</td>

                    </tr>

                  ))}

                </tbody>

              </table>

            </div>

          )}

        </section>



        <div className="notice">

          <strong>Prototype limitations:</strong> All data and business rules are synthetic.

          Predictions are estimates for one product in one store. Results assume available stock

          is shared across campaign days, with no replenishment. The optimizer does not establish

          causal campaign lift.

        </div>



        <div className="footer">

          ARCO Agent 2.0 · Retail Intelligence · Synthetic-data prototype · Not connected to production systems

        </div>

      </main>

    </div>

  );

}



ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>

</html>
